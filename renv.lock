      "Authors@R": "c(person(\"Emmanuel\", \"Sikali\", role=\"pdr\", email = \"Emmanuel.Sikali@ed.gov\"), person(\"Paul\", \"Bailey\", role=c(\"aut\", \"cre\"), email=\"pbailey@air.org\"), person(\"Blue\", \"Webb\", role=\"aut\"), person(\"Claire\", \"Kelley\", role=\"aut\"), person(\"Trang\", \"Nguyen\", role=\"aut\"), person(\"Huade\", \"Huo\", role=\"aut\"), person(\"Steve\",\"Walker\",role=\"cph\",comment=\"lme4pureR PIRLS function\"), person(\"Doug\",\"Bates\",role=\"cph\",comment=\"lme4pureR PIRLS function\"), person(\"Eric\", \"Buehler\", role=\"ctb\"), person(c(\"Christian\", \"Christrup\"), \"Kjeldsen\", role=\"ctb\"))",
      "Maintainer": "Paul Bailey <pbailey@air.org>",
